name: ci

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Restore .NET dependencies
        run: dotnet restore First10.slnx

      - name: Verify formatting
        run: dotnet format First10.slnx --no-restore --verify-no-changes

      - name: Build backend
        run: dotnet build First10.slnx --no-restore --configuration Release

      - name: Run backend tests
        run: dotnet test First10.slnx --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Install frontend dependencies
        run: npm ci --prefix web

      - name: Lint frontend
        run: npm --prefix web run lint

      - name: Test frontend
        run: npm --prefix web run test

      - name: Build frontend
        run: npm --prefix web run build

      - name: Build API image
        run: docker build --file src/First10.Api/Dockerfile --tag first10-api:ci .

      - name: Build worker image
        run: docker build --file src/First10.Worker/Dockerfile --tag first10-worker:ci .
